name: File Manager development builds
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  house-style:
    name: House-style spelling regression checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify scanner fixtures and corrected C++ consumer scope
        run: |
          python3 -B -m unittest discover -s tools -p test_house_style.py
          python3 -B tools/check_house_style.py frontend/include frontend/src frontend/tests frontend/examples orchestrator/conformance/clients/cpp
          python3 -B tools/check_house_style.py gui_forms/include/gui_forms/text_mask.hpp gui_forms/include/gui_forms/text_mask gui_forms/src/core/text/text_mask gui_forms/src/render/text/text_mask gui_forms/tests/text_mask_lifecycle_tests.cpp gui_forms/tests/text_mask_native_tests.cpp gui_forms/tests/text_mask_wrapping_tests.cpp gui_forms/tests/text_mask_cost_probe.cpp
  native:
    name: ${{ matrix.platform }}
    needs: house-style
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Preserve Windows checkout line-ending policy across Git implementations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Checkout uses Git for Windows; the build uses MSYS Git, whose
          # separate system config otherwise misreports CRLF files as changed.
          git config --local core.autocrlf true
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang generate-ninja pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libatk1.0-dev libatk-bridge2.0-dev xvfb xauth xdg-utils
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python git
      - name: Check reference search behavior and listener ownership
        shell: bash
        run: node gui_forms/tests/api_reference_search_tests.js
      - name: Identify dependency compiler
        id: dependency-compiler
        if: runner.os != 'Windows'
        shell: bash
        run: python3 tools/native_compiler_identity.py
      - name: Restore pinned source and Skia build cache
        id: native-dependencies
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-${{ matrix.platform }}/skia
          key: native-deps-v1-${{ matrix.platform }}-${{ steps.dependency-compiler.outputs.identity }}-${{ hashFiles('gui_forms/third_party/fetch_skia_cpu.sh', 'gui_forms/third_party/fetch_text_stack.sh', 'gui_forms/third_party/build_skia_cpu*.sh', 'gui_forms/third_party/skia*.patch', 'gui_forms/third_party/skia_cpu_args.gn', 'tools/build_native.py', 'tools/native_build_support.py') }}
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python -B tools/native_build_tests.py
          python -B gui_forms/tests/verify_install_tests.py
          python tools/build_native.py --jobs 2
          python -B tools/export_native_sdks_tests.py
          python -B tools/export_native_sdks.py
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          python3 -B tools/native_build_tests.py
          python3 -B gui_forms/tests/verify_install_tests.py
          python3 tools/build_native.py --jobs 2
          python3 -B tools/export_native_sdks_tests.py
          python3 -B tools/export_native_sdks.py
      - name: Build Linux with test display
        if: runner.os == 'Linux'
        run: |
          python3 -B tools/native_build_tests.py
          python3 -B gui_forms/tests/verify_install_tests.py
          xvfb-run -a python3 tools/build_native.py --jobs 2
          python3 -B tools/export_native_sdks_tests.py
          python3 -B tools/export_native_sdks.py
      # Export the normal OFF SDK above before enabling source-only development
      # tests. This option does not change the Core/Painter ABI or install headers.
      - name: Test development text-mask ownership on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
          if [ -f .build/native-${{ matrix.platform }}/gui-forms/Testing/Temporary/LastTest.log ]; then
            cp .build/native-${{ matrix.platform }}/gui-forms/Testing/Temporary/LastTest.log .build/native-${{ matrix.platform }}/gui-forms/Testing/Temporary/SDKLastTest.log
          fi
          cmake -S gui_forms -B .build/native-${{ matrix.platform }}/gui-forms -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON -DGUI_FORMS_BUILD_TEXT_MASKS=ON
          cmake --build .build/native-${{ matrix.platform }}/gui-forms --target gui_forms_text_mask_lifecycle_tests gui_forms_text_mask_native_tests gui_forms_text_mask_wrapping_tests gui_forms_linebreak_conformance_tests --parallel 2
          ctest --test-dir .build/native-${{ matrix.platform }}/gui-forms -R '^gui_forms_(text_mask_(lifecycle|native|wrapping)_tests|linebreak_conformance)$' --output-on-failure
      - name: Test development text-mask ownership on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
          if [ -f .build/native-${{ matrix.platform }}/gui-forms/Testing/Temporary/LastTest.log ]; then
            cp .build/native-${{ matrix.platform }}/gui-forms/Testing/Temporary/LastTest.log .build/native-${{ matrix.platform }}/gui-forms/Testing/Temporary/SDKLastTest.log
          fi
          cmake -S gui_forms -B .build/native-${{ matrix.platform }}/gui-forms -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON -DGUI_FORMS_BUILD_TEXT_MASKS=ON -DGUI_FORMS_BUILD_PREPARED_TEXT=ON
          cmake --build .build/native-${{ matrix.platform }}/gui-forms --target gui_forms_text_mask_lifecycle_tests gui_forms_text_mask_native_tests gui_forms_text_mask_wrapping_tests gui_forms_linebreak_conformance_tests gui_forms_prepared_text_service_tests gui_forms_prepared_text_raster_tests gui_forms_prepared_display_tests gui_forms_prepared_text_skia_tests --parallel 2
          ctest --test-dir .build/native-${{ matrix.platform }}/gui-forms -R '^gui_forms_(text_mask_(lifecycle|native|wrapping)_tests|linebreak_conformance|prepared_text_(service|raster|skia)_tests|prepared_display_tests)$' --output-on-failure
      - name: Measure Mac paint phases with a controlled surrogate
        if: runner.os == 'macOS'
        # Scheduling can reject comparability on a shared runner. Preserve the
        # rejected measurement without invalidating the already-tested SDK.
        continue-on-error: true
        run: python3 -B tools/run_macos_paint_cost.py
      - name: Attribute focused blank-textbox CPU with native deferred painting
        if: always() && runner.os == 'macOS'
        # A rejected interval is retained evidence, not a failed SDK or CPU fix.
        # Preserve an attempt even if another native test failed. The runner
        # records missing executables explicitly when compilation did not finish.
        continue-on-error: true
        run: python3 -B tools/run_macos_focused_cpu.py
      - name: Save pinned dependency cache after build attempts
        if: always() && runner.os != 'Windows' && steps.native-dependencies.outputs.cache-primary-key != '' && steps.native-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-${{ matrix.platform }}/skia
          key: ${{ steps.native-dependencies.outputs.cache-primary-key }}
      - name: Upload verified development archive
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/dist/*.zip
            .build/native-${{ matrix.platform }}/dist/*.tar.gz
            .build/native-${{ matrix.platform }}/dist/*.sha256
          if-no-files-found: error
      - name: Upload verified matching native SDKs
        uses: actions/upload-artifact@v4
        with:
          name: gui-forms-picker-sdk-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/sdk-dist/*.zip
            .build/native-${{ matrix.platform }}/sdk-dist/*.sha256
          if-no-files-found: error
      - name: Preserve build/test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/**/Testing/Temporary/*LastTest.log
            .build/native-${{ matrix.platform }}/**/CMakeConfigureLog.yaml
            .build/native-${{ matrix.platform }}/package-check.json
            .build/native-${{ matrix.platform }}/source-state-*.json
            .build/native-${{ matrix.platform }}/paint-cost/*
            .build/native-${{ matrix.platform }}/focused-cpu/*
          if-no-files-found: ignore
