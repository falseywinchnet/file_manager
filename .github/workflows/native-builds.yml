name: File Manager development builds
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang generate-ninja pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libatk1.0-dev libatk-bridge2.0-dev xvfb xauth xdg-utils
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python git
      - name: Identify dependency compiler
        id: dependency-compiler
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          commands = [['clang', '--version']]
          if os.uname().sysname == 'Darwin':
              commands += [['xcrun', '--show-sdk-version']]
          text = os.environ.get('ImageVersion', '')
          for command in commands:
              text += subprocess.check_output(command, text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('identity=' + hashlib.sha256(text.encode()).hexdigest()[:20] + '\n')
          PY
      - name: Restore pinned source and Skia build cache
        id: native-dependencies
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-${{ matrix.platform }}/skia
          key: native-deps-v1-${{ matrix.platform }}-${{ steps.dependency-compiler.outputs.identity }}-${{ hashFiles('gui_forms/third_party/fetch_skia_cpu.sh', 'gui_forms/third_party/fetch_text_stack.sh', 'gui_forms/third_party/build_skia_cpu*.sh', 'gui_forms/third_party/skia*.patch', 'gui_forms/third_party/skia_cpu_args.gn', 'tools/build_native.py') }}
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python tools/build_native.py --jobs 2
      - name: Build macOS
        if: runner.os == 'macOS'
        run: python3 tools/build_native.py --jobs 2
      - name: Build Linux with test display
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/build_native.py --jobs 2
      - name: Save pinned dependency cache after build attempts
        if: always() && runner.os != 'Windows' && steps.native-dependencies.outputs.cache-primary-key != '' && steps.native-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-${{ matrix.platform }}/skia
          key: ${{ steps.native-dependencies.outputs.cache-primary-key }}
      - name: Upload verified development archive
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/dist/*.zip
            .build/native-${{ matrix.platform }}/dist/*.tar.gz
            .build/native-${{ matrix.platform }}/dist/*.sha256
          if-no-files-found: error
      - name: Preserve build/test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/**/Testing/Temporary/LastTest.log
            .build/native-${{ matrix.platform }}/**/CMakeConfigureLog.yaml
            .build/native-${{ matrix.platform }}/package-check.json
          if-no-files-found: ignore
