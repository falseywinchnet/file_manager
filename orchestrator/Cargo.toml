[package]
name = "fileman-orchestrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "File Manager headless integration-authority core"
license = "UNLICENSED"
publish = false

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
