[package]
name = "fileman-orchestrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "File Manager headless integration-authority core"
license = "UNLICENSED"
publish = false

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[[bin]]
name = "orchestrator-worker-bench"
path = "src/bin/worker_bench.rs"

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "socket", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
service-binding = "3.0.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
