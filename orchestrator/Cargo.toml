[package]
name = "fileman-orchestrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "File Manager headless integration-authority core"
license = "UNLICENSED"
publish = false

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[[bin]]
name = "orchestrator-worker-bench"
path = "src/bin/worker_bench.rs"

[[bin]]
name = "orchestrator-fixtures"
path = "src/bin/generate_fixtures.rs"

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "socket", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
service-binding = "3.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
