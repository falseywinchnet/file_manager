[package]
name = "file-manager-preview-supervision-lab"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace]

[dependencies]
file-manager-preview-frame-lab = { path = "../preview_frame" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }
